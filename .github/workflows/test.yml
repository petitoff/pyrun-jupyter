name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allows manual trigger

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --extra dev --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest tests/ -v --tb=short

      - name: Generate coverage report
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: uv run --locked --python ${{ matrix.python-version }} pytest tests/ --cov=pyrun_jupyter --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --extra dev --locked --python 3.12

      - name: Run ruff (linter)
        run: uv run --locked ruff check src/ tests/

      - name: Run ruff (formatter check)
        run: uv run --locked ruff format --check src/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --extra dev --locked --python 3.12

      - name: Run mypy
        run: uv run --locked mypy src/pyrun_jupyter --ignore-missing-imports
